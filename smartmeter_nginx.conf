server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Default for new MUC-Pi installations.
    # setup.sh writes the live nginx config with the actual installation path.
    server_name muc localhost 127.0.0.1 _;
    root /home/pi/MUC-Pi;

    client_max_body_size 10M;

    access_log /var/log/nginx/smartmeter_access.log;
    error_log /var/log/nginx/smartmeter_error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /home/pi/MUC-Pi/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
